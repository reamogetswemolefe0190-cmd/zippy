name: Deploy Zippy Web & Marketing Hub

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: zippy_app
        run: flutter pub get

      - name: Run Tests
        working-directory: zippy_app
        run: flutter test

      - name: Build Flutter Web
        working-directory: zippy_app
        run: flutter build web --release --base-href "/zippy/"

      - name: Copy Assets & Extra Web Pages
        run: |
          cp zippy_logo.png zippy_app/build/web/ || true
          cp zippy_logo.svg zippy_app/build/web/ || true
          cp zippy_logo_transparent.png zippy_app/build/web/ || true
          cp zippy_logo_for_light_bg.png zippy_app/build/web/ || true
          cp zippy_app_icon.png zippy_app/build/web/ || true
          cp zippy_app/web/marketing_kit.html zippy_app/build/web/ || true
          cp zippy_app/web/logo_download.html zippy_app/build/web/ || true
          cp zippy_app/web/logo_showcase.html zippy_app/build/web/ || true
          touch zippy_app/build/web/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: zippy_app/build/web

      - name: Deploy to gh-pages branch (Fallback)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: zippy_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
